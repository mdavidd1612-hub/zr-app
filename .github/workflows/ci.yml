name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndWljcHFlZmhrb2tseHdzdnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE2NzMzMDU2OTksImV4cCI6MTk4OTA4NTY5OX0.XRPnKsqGLlJzVhSyg_qV2Yl5V4qXXQuH8BIJ8zzGPTw

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase
        run: |
          npm install -g supabase@latest
          supabase start
          supabase db reset

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run RLS security tests
        run: npm run test:rls

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
