name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndWljcHFlZmhrb2tseHdzdnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE2NzMzMDU2OTksImV4cCI6MTk4OTA4NTY5OX0.XRPnKsqGLlJzVhSyg_qV2Yl5V4qXXQuH8BIJ8zzGPTw

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: supabase/postgres:15.1.0.147
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: -c search_path=public
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase
        run: |
          npm install -g supabase@latest
          supabase start --no-seed
          supabase db reset --no-seed

      - name: Apply migrations
        run: supabase db reset --no-seed

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run RLS security tests
        run: npm run test:rls

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage/
